#!/usr/sbin/nft -f
# Mini Enterprise CN-Server firewall TEMPLATE.
# Replace 192.168.31.204 with the SOC VM's actual IP before use.
# Test: sudo nft -c -f /etc/nftables.conf. Ensure console recovery access.
flush ruleset
table inet mini_enterprise {
    set blocked_ips {
        type ipv4_addr
        flags timeout
    }
    chain input {
        type filter hook input priority filter; policy drop;
        ip saddr @blocked_ips counter drop
        iifname "lo" accept
        ct state invalid counter drop
        ct state established,related accept

        # Null, Xmas and SYN-FIN scan flag combinations
        tcp flags & (fin | syn) == (fin | syn) counter drop
        tcp flags & (fin | psh | urg) == (fin | psh | urg) counter drop
        tcp flags & (fin | syn | rst | psh | ack | urg) == 0 counter drop

        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } limit rate 10/second burst 20 packets accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } limit rate 20/second burst 40 packets accept

        # Rate-limit new SSH connections; also restrict SSH to trusted admin IPs in production.
        tcp dport 22 ct state new limit rate 6/minute burst 4 packets accept

        # Requested application ports; narrow to required client ranges where possible.
        tcp dport { 80, 8080, 443 } ct state new limit rate 100/second burst 200 packets accept

        # SOC-to-agent management port; replace IP and port for your actual design.
        ip saddr 192.168.31.204 tcp dport 8443 ct state new accept
        counter drop
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state invalid counter drop
        ct state established,related accept
        counter drop
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
